apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Best Practices, Supply Chain Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Restringe las imágenes de contenedores para que solo provengan de
      registros de confianza autorizados (docker.io, ghcr.io, gcr.io, registry.k8s.io).
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: validate-trusted-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Solo se permiten imágenes provenientes de registros de confianza (docker.io, ghcr.io, gcr.io, registry.k8s.io)."
        pattern:
          spec:
            containers:
              - image: "docker.io/* | ghcr.io/* | gcr.io/* | registry.k8s.io/*"

